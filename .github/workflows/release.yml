name: release

on:
  push:
    branches: [main]
    paths:
      - '.github/releases/*-v*.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing module tag with matching .github/releases/<tag>.md notes'
        required: true

permissions:
  contents: read

concurrency:
  group: module-releases
  cancel-in-progress: false

jobs:
  publish:
    # All three must hold: this repository, its main branch, and public visibility.
    if: ${{ github.repository == 'pschmidt3200/android-patches-crdroid' && github.ref == 'refs/heads/main' && toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and publish existing module tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/release-modules.sh "${TAG}"
