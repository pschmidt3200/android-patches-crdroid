name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    # Standard hosted runners are free for public repositories; skip private copies.
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Generated standalone installers and generator behaviour
        run: |
          python3 .github/scripts/generate-installers.py --check
          python3 .github/scripts/test-generate-installers.py

      - name: Module release selection and publication guards
        run: python3 .github/scripts/test-release-modules.py

      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: Module structure and patch format
        run: bash .github/scripts/check-modules.sh

      - name: Markdown link validation behaviour
        run: bash .github/scripts/test-markdown-links.sh

      - name: apply-patches.sh behaviour
        run: |
          for script in */apply-patches.sh; do
            bash .github/scripts/test-apply-script.sh "$(dirname "${script}")"
          done
