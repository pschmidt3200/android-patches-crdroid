name: Patch problem
description: A patch does not apply, does not build, or misbehaves on the reference setup.
title: "[module] short description"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        This is a **private hobby project**. Fixes and tests are only possible on hardware I own
        (OnePlus 13 reference device). Reports from other devices are welcome as information, but
        there is no promise of support or a port.

        Please remove Bluetooth MAC addresses and serial numbers from logs before posting.
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Before you submit
      options:
        - label: I have read the disclaimer and understand that there is no support guarantee.
          required: true
        - label: The module files I used came from the same commit of this repository (no older editions mixed in).
          required: true
  - type: input
    id: patch_revision
    attributes:
      label: Patch version or release tag
      description: The release tag you downloaded (e.g. aptx-adaptive-v1.2, v1.0) or git commit SHA.
      placeholder: e.g. aptx-adaptive-v1.2 or v1.0
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - aptx-adaptive
        - bluetooth-codec-ui
        - gms-fixes
        - gps-servers
        - donation-disable
        - bbrv3
        - bbrv3-experimental
        - susfs-core
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where does it fail?
      options:
        - git apply / apply-patches.sh --check
        - ROM build (compile or link error)
        - On the device (runtime behaviour)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model and codename
      placeholder: e.g. OnePlus 13 (dodge)
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: ROM version
      description: Which crDroid version/branch (e.g. crDroid 16.0). Add sync date if known.
      placeholder: e.g. crDroid 16.0
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error message or log excerpt
      description: Paste the terminal error output (git apply / build error) or relevant logcat lines here.
      render: shell
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional details (optional)
      description: What did you expect and what happened instead? Details about audio devices, apps, or setup.

